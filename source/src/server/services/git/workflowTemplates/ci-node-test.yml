name: AppEndO CI

# Temporarily disabled — restore push/pull_request triggers and remove `if: false` to re-enable.
on:
  workflow_dispatch:

jobs:
  test:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:critical
